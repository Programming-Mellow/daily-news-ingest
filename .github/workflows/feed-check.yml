name: Feed Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  feed-check:
    name: Verify RSS feeds resolve
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check feeds
        run: python main.py --feeds-only
